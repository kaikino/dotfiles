#? btop config — navy theme, square corners, block graphs.
color_theme = "/opt/homebrew/opt/btop/share/btop/themes/tokyo-night.theme"
# False = draw on the terminal's background, so btop inherits the
# window transparency instead of painting an opaque rectangle.
theme_background = False
truecolor = True
rounded_corners = False
# Block glyphs over braille dots: chunkier, reads as a TTY meter.
graph_symbol = "block"
shown_boxes = "cpu mem net proc"
update_ms = 1000
proc_sorting = "cpu lazy"
proc_tree = False
proc_gradient = True
vim_keys = True
show_uptime = True
check_temp = True
show_battery = True
