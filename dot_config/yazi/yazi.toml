# yazi — file manager. Three columns: parent / current / preview.
[mgr]
ratio = [1, 3, 4]
sort_by = "natural"
sort_dir_first = true
sort_sensitive = false
show_hidden = false
show_symlink = true
linemode = "size"
scrolloff = 5

[preview]
tab_size = 2
max_width = 1200
max_height = 1600
image_delay = 30
